name: Gemini Code Review

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json')
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Review with Gemini
        if: steps.diff.outputs.diff != ''
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const diff = `${{ steps.diff.outputs.diff }}`;

            const prompt = `あなたはコードレビュアーです。以下のdiffをレビューしてください。
            改善点やバグの可能性があれば指摘してください。日本語で回答してください。

            \`\`\`diff
            ${diff}
            \`\`\``;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                }),
              }
            );

            const data = await response.json();

            if (!response.ok) {
              core.setFailed(`Gemini API error: ${JSON.stringify(data)}`);
              return;
            }

            const reviewText = data.candidates?.[0]?.content?.parts?.[0]?.text
              || 'レビュー結果を取得できませんでした。';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Gemini Code Review\n\n${reviewText}`,
            });
